
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profil Mahasiswa Teknik Informatika</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            /* Background Biru Teknik Informatika */
            background:
                linear-gradient(
                    135deg,
                    #003b73,
                    #0074b7,
                    #00a8e8
                );

            overflow: hidden;
        }

        /* Efek lingkaran background */
        body::before {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
            top: -100px;
            left: -100px;
        }

        body::after {
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
            bottom: -180px;
            right: -150px;
        }

        /* Kartu Profil */
        .card {
            position: relative;
            z-index: 2;

            width: 370px;
            padding: 35px 30px;

            background: rgba(255,255,255,0.95);

            border-radius: 25px;

            text-align: center;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.3);

            backdrop-filter: blur(10px);
        }

        /* Foto */
        .foto {
            width: 120px;
            height: 120px;

            object-fit: cover;

            border-radius: 50%;

            border: 5px solid #0074b7;

            box-shadow:
                0 5px 20px rgba(0,116,183,0.4);

            margin-bottom: 15px;
        }

        /* Nama */
        h1 {
            margin: 5px 0;

            color: #003b73;

            font-size: 28px;
        }

        /* Jurusan */
        .jurusan {
            color: #0074b7;

            font-weight: bold;

            margin: 5px 0 15px;
        }

        /* Informasi */
        .info {
            background: #f1f8ff;

            padding: 12px;

            border-radius: 12px;

            margin-bottom: 20px;

            color: #333;

            line-height: 1.6;
        }

        .info b {
            color: #003b73;
        }

        /* Tombol sosial media */
        .social {
            display: block;

            text-decoration: none;

            color: white;

            padding: 13px;

            margin: 12px 0;

            border-radius: 12px;

            font-weight: bold;

            transition: 0.3s;

            box-shadow:
                0 5px 12px rgba(0,0,0,0.15);
        }

        .social:hover {
            transform: translateY(-4px);

            box-shadow:
                0 8px 18px rgba(0,0,0,0.25);
        }

        /* TikTok */
        .tiktok {
            background: #111111;
        }

        /* WhatsApp */
        .whatsapp {
            background: #25D366;
        }

        /* Instagram */
        .instagram {
            background:
                linear-gradient(
                    45deg,
                    #feda75,
                    #d62976,
                    #962fbf,
                    #4f5bd5
                );
        }

        /* Footer */
        footer {
            margin-top: 22px;

            color: #777;

            font-size: 12px;
        }

        /* Tampilan HP */
        @media (max-width: 450px) {

            .card {
                width: 90%;
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
